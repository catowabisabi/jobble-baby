name: Test and Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '*'
    paths-ignore:
      - '**.md'

jobs:
  test:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: JobbleBaby/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: JobbleBaby

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: JobbleBaby

      - name: Expo dependency validation
        run: npx expo install --check
        working-directory: JobbleBaby

      - name: Run Smoke Tests
        run: npx ts-node --project tsconfig.test.json __tests__/smoke/smoke-tests.ts
        working-directory: JobbleBaby

      - name: Upload Smoke Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: JobbleBaby/runtime/logs/tests/**/report.md