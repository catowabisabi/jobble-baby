# AI Job Scraper - Docker Compose Configuration
# This file replaces both docker-compose.yml and docker-compose.vllm.yml
# Use: docker compose up          - for app only
# Use: docker compose --profile vllm up - for app + vllm server

services:
  # Main application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: ai-job-scraper:latest
    container_name: ai-job-scraper

    ports:
      - "8501:8501"

    volumes:
      # Database persistence
      - ./dbdata:/app/db
      # Environment file (optional)
      - ./.env:/app/.env:ro
      # Static files (optional)
      - ./static:/app/static:ro

    environment:
      - DB_URL=sqlite:////app/db/jobs.db
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Override in .env for production:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - VLLM_BASE_URL=${VLLM_BASE_URL:-http://localhost:8000/v1}

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - ai-job-scraper-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # vLLM local inference server (optional, use --profile vllm)
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: ai-job-scraper-vllm
    profiles:
      - vllm
    ports:
      - "8000:8000"
      - "8001:8001"  # Metrics port
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_LOGGING_LEVEL=INFO
      - VLLM_API_KEY=${VLLM_API_KEY:-vllm-server-key}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:rw
      - ./config/vllm:/app/config:ro
      - ./logs/vllm:/app/logs:rw
    command: >
      --model Qwen/Qwen3-4B-Instruct-2507-FP8
      --quantization fp8
      --max-model-len 8192
      --gpu-memory-utilization 0.9
      --swap-space 4
      --enable-prefix-caching
      --max-num-seqs 128
      --disable-log-requests
      --port 8000
      --host 0.0.0.0
      --served-model-name Qwen3-4B-Instruct-2507-FP8
      --enable-chunked-prefill
      --max-num-batched-tokens 2048
      --kv-cache-dtype fp8
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 20G
          cpus: "8"
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

    networks:
      - ai-job-scraper-network

  # Prometheus metrics scraper (optional, use --profile monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: vllm-prometheus
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - ai-job-scraper-network
    depends_on:
      - vllm-server

networks:
  ai-job-scraper-network:
    driver: bridge

volumes:
  prometheus-data:
    driver: local